services:
  postgres:
    image: postgres:16-alpine
    container_name: falcon-postgres
    environment:
      POSTGRES_USER: ${FALCON_DB_USER:-falcon}
      POSTGRES_PASSWORD: ${FALCON_DB_PASSWORD:-falcon_dev}
      POSTGRES_DB: ${FALCON_DB_NAME:-falcon}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: falcon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: falcon-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${FALCON_RABBITMQ_USER:-falcon}
      RABBITMQ_DEFAULT_PASS: ${FALCON_RABBITMQ_PASSWORD:-falcon_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: falcon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FALCON_MINIO_USER:-falcon}
      MINIO_ROOT_PASSWORD: ${FALCON_MINIO_PASSWORD:-falcon_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: falcon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set falcon http://minio:9000 ${FALCON_MINIO_USER:-falcon} ${FALCON_MINIO_PASSWORD:-falcon_dev};
      mc mb falcon/raw-videos --ignore-existing;
      mc mb falcon/processed-videos --ignore-existing;
      exit 0;
      " 

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

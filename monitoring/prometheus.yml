global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'falcon-services'
    static_configs:
      - targets:
          - 'api-gateway:3000'
          - 'upload-service:3001'
          - 'metadata-service:3002'
          - 'hls-service:3003'
          - 'notification-service:3004'
          - 'transcoding-worker:3005'
    metrics_path: '/health'

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']

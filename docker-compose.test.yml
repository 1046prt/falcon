version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: falcon_secret
      POSTGRES_DB: falcon
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: falcon
      RABBITMQ_DEFAULT_PASS: falcon_secret
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: falcon
      MINIO_ROOT_PASSWORD: falcon_secret
    ports:
      - "9000:9000"
      - "9001:9001"

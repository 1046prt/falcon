apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcon-api-gateway
  namespace: falcon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: falcon-api-gateway
  template:
    metadata:
      labels:
        app: falcon-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: falcon/api-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: UPLOAD_SERVICE_URL
              value: "http://falcon-upload-service:3001"
            - name: METADATA_SERVICE_URL
              value: "http://falcon-metadata-service:3002"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: falcon-api-gateway
  namespace: falcon
spec:
  selector:
    app: falcon-api-gateway
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer

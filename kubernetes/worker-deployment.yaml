apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcon-transcoding-worker
  namespace: falcon
  labels:
    app: falcon-transcoding-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: falcon-transcoding-worker
  template:
    metadata:
      labels:
        app: falcon-transcoding-worker
    spec:
      containers:
        - name: worker
          image: falcon/transcoding-worker:latest
          ports:
            - containerPort: 8080
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: falcon-secrets
                  key: rabbitmq-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: falcon-secrets
                  key: jwt-secret
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: falcon-secrets
                  key: internal-api-key
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: falcon-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: falcon-secrets
                  key: s3-secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: falcon-secrets
                  key: database-url
            - name: S3_ENDPOINT
              value: "https://s3.amazonaws.com"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: falcon-worker-hpa
  namespace: falcon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: falcon-transcoding-worker
  minReplicas: 2
  maxReplicas: 50
  metrics:
    - type: External
      external:
        metric:
          name: rabbitmq_queue_messages
          selector:
            matchLabels:
              queue: falcon.transcoding
        target:
          type: AverageValue
          averageValue: "5"
